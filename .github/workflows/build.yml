name: Build installers

on:
  push:
    branches: [main, feat/mvp-visual-editor]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-14, args: '--mac --arm64' }
          - { name: macos-x64, os: macos-15-intel, args: '--mac --x64' }
          - { name: windows-x64, os: windows-latest, args: '--win --x64' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # ffmpeg-static downloads the binary for the *build host*, so each OS/arch builds its own installer.
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned builds (no certificates configured yet)
      - uses: actions/upload-artifact@v4
        with:
          name: HIGH-HUMAN-LAB-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
