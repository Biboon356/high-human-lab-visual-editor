name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request: # covers feature branches, so branch pushes are not built twice
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  e2e:
    # Drives the real Electron app under Xvfb (software GL) — a test harness only, nobody runs the app on Linux.
    # Takes ~16 min, so it runs on demand (Actions > Build installers > Run workflow), not on every push or release.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6
      - run: npm ci
      - run: xvfb-run -a -s "-screen 0 1700x1000x24" npm run test:e2e
        env:
          HHLAB_SHOTS: ${{ github.workspace }}/e2e-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-shots/
          if-no-files-found: ignore

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-14, args: '--mac --arm64' }
          - { name: macos-x64, os: macos-15-intel, args: '--mac --x64' }
          - { name: windows-x64, os: windows-latest, args: '--win --x64' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # a tagged release is built with the tag's version, so the installer and its in-app update bundle agree
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      # ffmpeg-static downloads the binary for the *build host*, so each OS/arch builds its own installer.
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned builds (no certificates configured yet)
      - uses: actions/upload-artifact@v4
        with:
          name: HIGH-HUMAN-LAB-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      # The in-app update bundle: src/ as one checksummed file + update.json. Installed apps of the same shell fetch it from the latest release.
      - name: Build the in-app update bundle
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          NOTES="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' | head -c 1800)"
          NOTES="$NOTES" node scripts/make-update.mjs
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
            dist-update/*
          generate_release_notes: true
